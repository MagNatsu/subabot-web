{% if page.episode_player.video_url %}
<section class="episode-player" data-episode-player-root>
  <movi-player
    class="episode-player__video"
    data-episode-player
    {% if page.image.path %}poster="{{ page.image.path | relative_url }}"{% endif %}
    controls
    playsinline
  >
    <p>O navegador não suporta a reprodução deste vídeo.</p>
  </movi-player>
  <script type="application/json" data-episode-player-config>
    {
      "videoUrl": {{ page.episode_player.video_url | jsonify }},
      "fonts": [
        {% for font in page.episode_player.fonts %}
          {{ font | relative_url | jsonify }}{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }
  </script>
</section>
<link rel="stylesheet" href="{{ '/assets/css/episode-player.css' | relative_url }}">
<script type="module" src="{{ '/assets/js/episode-player.js' | relative_url }}"></script>
{% endif %}
